<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with PDF</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Light Theme (Default) */
            --bg-light: #f8f9fa;
            --bg-white: #ffffff;
            --bg-gray: #f0f1f3;
            --text-dark: #1a1a1a;
            --text-muted: #6b7280;
            --accent-primary: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #e5e7eb;
            --border-dark: #d1d5db;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
        }

        [data-theme="dark"] {
            /* Dark Theme */
            --bg-light: #0f172a;
            --bg-white: #1e293b;
            --bg-gray: #334155;
            --text-dark: #f1f5f9;
            --text-muted: #cbd5e1;
            --accent-primary: #3b82f6;
            --accent-hover: #60a5fa;
            --border-color: #475569;
            --border-dark: #64748b;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Theme Toggle */
        .theme-toggle-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
        }

        .theme-toggle-checkbox {
            display: none;
        }

        .theme-toggle-label {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: var(--bg-white);
            border: 1.5px solid var(--border-color);
            border-radius: 50px;
            padding: 6px 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-sm);
            user-select: none;
        }

        .theme-toggle-label:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--accent-primary);
        }

        .toggle-icon-light,
        .toggle-icon-dark {
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            transition: all 0.3s ease;
        }

        .toggle-icon-light {
            opacity: 1;
            transform: scale(1);
        }

        .toggle-icon-dark {
            opacity: 0.4;
            transform: scale(0.8);
        }

        .toggle-slider {
            width: 2px;
            height: 16px;
            background-color: var(--border-color);
            border-radius: 1px;
            transition: all 0.3s ease;
        }

        [data-theme="dark"] .toggle-icon-light {
            opacity: 0.4;
            transform: scale(0.8);
        }

        [data-theme="dark"] .toggle-icon-dark {
            opacity: 1;
            transform: scale(1);
        }

        [data-theme="dark"] .toggle-slider {
            background-color: #60a5fa;
        }

        /* Header */
        .chat-header {
            background-color: var(--bg-white);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: var(--shadow-sm);
            flex-shrink: 0;
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s ease;
            color: var(--text-dark);
        }

        .back-btn:hover {
            background-color: var(--bg-gray);
        }

        .header-info h1 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .header-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Messages Container */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user .message-bubble {
            background-color: var(--accent-primary);
            color: white;
            border-radius: 18px 18px 4px 18px;
        }

        .message.ai .message-bubble {
            background-color: var(--bg-gray);
            color: var(--text-dark);
            border-radius: 18px 18px 18px 4px;
        }

        .message-bubble p {
            margin: 0;
            font-weight: 500;
        }

        .message-bubble p + p {
            margin-top: 8px;
        }

        .message-bubble strong {
            font-weight: 700;
        }

        .message-bubble ul {
            margin: 8px 0;
            padding-left: 20px;
        }

        .message-bubble li {
            margin: 4px 0;
        }

        .message-bubble h2 {
            font-size: 1.1rem;
            margin: 8px 0 4px 0;
            font-weight: 700;
        }

        .message-bubble h3 {
            font-size: 1rem;
            margin: 6px 0 3px 0;
            font-weight: 700;
        }

        /* Input Area */
        .input-area {
            background-color: var(--bg-white);
            border-top: 1px solid var(--border-color);
            padding: 16px 20px;
            display: flex;
            gap: 12px;
            flex-shrink: 0;
            box-shadow: var(--shadow-sm);
        }

        .input-field {
            flex: 1;
            padding: 12px 14px;
            background-color: var(--bg-gray);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-dark);
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--accent-primary);
            background-color: var(--bg-white);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.08);
        }

        .input-field::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            padding: 12px 24px;
            background-color: var(--accent-primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            white-space: nowrap;
        }

        .send-btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* API Key Input */
        .api-key-section {
            background-color: var(--bg-white);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 20px;
            display: none;
        }

        .api-key-section.show {
            display: block;
        }

        .api-key-input {
            width: 100%;
            max-width: 400px;
            padding: 12px 14px;
            background-color: var(--bg-gray);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-dark);
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .api-key-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            background-color: var(--bg-white);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.08);
        }

        .api-key-input::placeholder {
            color: var(--text-muted);
        }

        .security-note {
            display: block;
            margin-top: 8px;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 500;
        }

        .loading-indicator {
            display: flex;
            gap: 6px;
            align-items: center;
            padding: 8px 12px;
            background-color: var(--bg-gray);
            border-radius: 18px;
            width: fit-content;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--accent-primary);
            animation: blink 1.4s infinite;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {
            0%, 60%, 100% {
                opacity: 0.3;
            }
            30% {
                opacity: 1;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .message-bubble {
                max-width: 85%;
            }

            .input-area {
                padding: 12px 16px;
            }

            .send-btn {
                padding: 10px 20px;
                font-size: 0.9rem;
            }

            .header-info h1 {
                font-size: 1rem;
            }
        }

        .error-message {
            background-color: #fee2e2;
            color: #991b1b;
            padding: 12px 16px;
            border-radius: 8px;
            margin: 8px 0;
            font-size: 0.9rem;
            border-left: 3px solid #dc2626;
        }
    </style>
</head>
<body>
    <!-- Theme Toggle -->
    <div class="theme-toggle-container">
        <input type="checkbox" id="themeToggle" class="theme-toggle-checkbox" />
        <label for="themeToggle" class="theme-toggle-label">
            <span class="toggle-icon-light">☀️</span>
            <span class="toggle-slider"></span>
            <span class="toggle-icon-dark">🌙</span>
        </label>
    </div>

    <!-- Header -->
    <div class="chat-header">
        <button class="back-btn" id="backBtn">←</button>
        <div class="header-info">
            <h1 id="pdfTitle">Chat with PDF</h1>
            <p id="pdfSubtitle">Ask anything about this document</p>
        </div>
    </div>

    <!-- API Key Section (hidden if already provided) -->
    <div class="api-key-section" id="apiKeySection">
        <input 
            type="password" 
            id="apiKeyInputChat" 
            class="api-key-input" 
            placeholder="Paste your Gemini API key"
            autocomplete="off"
        >
        <small class="security-note">🔒 Your API key is never stored or sent anywhere except Gemini</small>
    </div>

    <!-- Messages Container -->
    <div class="messages-container" id="messagesContainer"></div>

    <!-- Input Area -->
    <div class="input-area">
        <input 
            type="text" 
            id="questionInputChat" 
            class="input-field" 
            placeholder="Ask me anything..."
            autocomplete="off"
        >
        <button class="send-btn" id="sendBtnChat">Send</button>
    </div>

    <script>
        // ===== THEME TOGGLE =====
        const themeToggle = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;

        function initializeTheme() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            let theme = savedTheme || (prefersDark ? 'dark' : 'light');
            htmlElement.setAttribute('data-theme', theme);
            themeToggle.checked = theme === 'dark';
        }

        function toggleTheme() {
            const currentTheme = htmlElement.getAttribute('data-theme') || 'light';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            htmlElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            themeToggle.checked = newTheme === 'dark';
        }

        themeToggle.addEventListener('change', toggleTheme);
        initializeTheme();

        // ===== DOM ELEMENTS =====
        const backBtn = document.getElementById('backBtn');
        const pdfTitle = document.getElementById('pdfTitle');
        const pdfSubtitle = document.getElementById('pdfSubtitle');
        const messagesContainer = document.getElementById('messagesContainer');
        const questionInputChat = document.getElementById('questionInputChat');
        const sendBtnChat = document.getElementById('sendBtnChat');
        const apiKeySection = document.getElementById('apiKeySection');
        const apiKeyInputChat = document.getElementById('apiKeyInputChat');

        // ===== STATE =====
        let pdfText = '';
        let pdfFileName = '';
        let apiKey = '';
        let isLoading = false;

        // ===== INITIALIZE =====
        function initialize() {
            // Get data from sessionStorage
            pdfText = sessionStorage.getItem('pdfText');
            pdfFileName = sessionStorage.getItem('pdfFileName') || 'PDF Document';
            apiKey = sessionStorage.getItem('apiKey') || '';

            // If no PDF data, redirect back
            if (!pdfText) {
                alert('No PDF data found. Redirecting back...');
                window.location.href = 'index.html';
                return;
            }

            // Update header
            pdfTitle.textContent = `Chat: ${pdfFileName}`;
            pdfSubtitle.textContent = `Ask anything about this document`;

            // Show API key input if not provided
            if (!apiKey) {
                apiKeySection.classList.add('show');
            } else {
                apiKeyInputChat.value = apiKey;
            }
        }

        // ===== FORMAT CHAT RESPONSE =====
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatChatResponse(text) {
            let html = escapeHtml(text);
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/^# (.*?)$/gm, '<h2>$1</h2>');
            html = html.replace(/^## (.*?)$/gm, '<h3>$1</h3>');

            const lines = html.split('\n');
            let inList = false;
            let formattedLines = [];

            for (let line of lines) {
                if (line.match(/^\s*[-•]\s+/)) {
                    if (!inList) {
                        formattedLines.push('<ul>');
                        inList = true;
                    }
                    line = line.replace(/^\s*[-•]\s+/, '');
                    formattedLines.push(`<li>${line}</li>`);
                } else {
                    if (inList && line.trim() !== '') {
                        formattedLines.push('</ul>');
                        inList = false;
                    }
                    formattedLines.push(line);
                }
            }

            if (inList) {
                formattedLines.push('</ul>');
            }

            html = formattedLines.join('\n');
            html = html.replace(/\n\n+/g, '</p><p>');
            html = html.replace(/\n/g, '<br>');

            if (!html.includes('<p>')) {
                html = `<p>${html}</p>`;
            }

            return html;
        }

        // ===== ADD MESSAGE TO CHAT =====
        function addMessage(text, isUser) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'ai'}`;

            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'message-bubble';

            if (isUser) {
                bubbleDiv.innerHTML = `<p>${escapeHtml(text)}</p>`;
            } else {
                bubbleDiv.innerHTML = formatChatResponse(text);
            }

            messageDiv.appendChild(bubbleDiv);
            messagesContainer.appendChild(messageDiv);

            // Scroll to bottom
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // ===== ASK QUESTION =====
        async function askQuestion(question) {
            if (!question.trim()) {
                alert('Please type a question.');
                return;
            }

            const currentApiKey = apiKeyInputChat.value || apiKey;
            if (!currentApiKey.trim()) {
                alert('Please enter your Gemini API key.');
                return;
            }

            // Add user message
            addMessage(question, true);
            questionInputChat.value = '';

            // Show loading indicator
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message ai';
            loadingDiv.innerHTML = '<div class="message-bubble"><div class="loading-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>';
            messagesContainer.appendChild(loadingDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            const prompt = `You are a document assistant. Answer the user's question using ONLY the content from the document below. If the answer is not in the document, say: "I couldn't find that in the document."

Document:
${pdfText}

User Question: ${question}`;

            try {
                isLoading = true;
                sendBtnChat.disabled = true;

                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${currentApiKey}`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{ text: prompt }]
                            }]
                        })
                    }
                );

                if (!response.ok) {
                    const errorData = await response.json();
                    if (response.status === 401) {
                        throw new Error('Invalid API key. Please check and try again.');
                    } else {
                        throw new Error(errorData.error?.message || 'Unknown error');
                    }
                }

                const data = await response.json();
                const answer = data.candidates[0].content.parts[0].text;

                // Remove loading indicator
                loadingDiv.remove();

                // Add AI response
                addMessage(answer, false);

                // Save API key if just entered
                if (!apiKey && currentApiKey) {
                    apiKey = currentApiKey;
                    apiKeySection.classList.remove('show');
                }
            } catch (error) {
                loadingDiv.remove();
                const errorDiv = document.createElement('div');
                errorDiv.className = 'message ai';
                errorDiv.innerHTML = `<div class="message-bubble"><div class="error-message">${error.message}</div></div>`;
                messagesContainer.appendChild(errorDiv);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            } finally {
                isLoading = false;
                sendBtnChat.disabled = false;
            }
        }

        // ===== EVENT LISTENERS =====
        backBtn.addEventListener('click', () => {
            window.location.href = 'index.html';
        });

        sendBtnChat.addEventListener('click', () => {
            askQuestion(questionInputChat.value);
        });

        questionInputChat.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !isLoading) {
                askQuestion(questionInputChat.value);
            }
        });

        // Initialize on load
        initialize();
    </script>
</body>
</html>
